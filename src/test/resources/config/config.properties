# ============================================================
# Default Configuration
# ============================================================
# These values are used when no environment-specific config
# and no system property overrides them.
#
# Priority: System Property > Env Config > This File
# ============================================================

# Application
base.url=https://opensource-demo.orangehrmlive.com

# Browser: chromium | firefox | webkit
browser=chromium

# Run headless (true/false)
headless=true

# Default timeout in milliseconds
timeout=30000

# Capture screenshot on test failure (true/false)
screenshot.on.failure=true

# Record video (true/false) — increases disk usage
video=false

# Capture Playwright trace on failure (true/false)
trace=true
