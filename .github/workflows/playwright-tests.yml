name: Playwright Tests

# Trigger: push to main, pull requests, or manual dispatch
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Set up Java 21
      # --------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # --------------------------------------------------------
      # 3. Install Playwright browsers and OS dependencies
      # --------------------------------------------------------
      - name: Install Playwright Browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      # --------------------------------------------------------
      # 4. Run smoke tests
      # --------------------------------------------------------
      - name: Run Smoke Tests
        run: mvn clean test -Dgroups=smoke -Dheadless=true

      # --------------------------------------------------------
      # 5. Upload Allure results
      # --------------------------------------------------------
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 30

      # --------------------------------------------------------
      # 6. Upload screenshots (only on failure)
      # --------------------------------------------------------
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: target/screenshots/
          retention-days: 7

      # --------------------------------------------------------
      # 7. Upload traces (only on failure)
      # --------------------------------------------------------
      - name: Upload Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-traces
          path: target/traces/
          retention-days: 7

      # --------------------------------------------------------
      # 8. Upload videos (only on failure)
      # --------------------------------------------------------
      - name: Upload Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: target/videos/
          retention-days: 7

      # --------------------------------------------------------
      # 9. Upload test logs
      # --------------------------------------------------------
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/logs/
          retention-days: 7
